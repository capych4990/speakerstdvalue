<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>speakerstd — ценность юнитов</title>
<style>
:root{--bg:#0b0b12;--card:#13131d;--line:#2a2a3c;--fg:#f1f0fa;--muted:#9a9ab8;--acc:#8b7bff;--acc-fg:#0b0b12;--img:#08080e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f3fb;--card:#fff;--line:#d9d8ea;--fg:#17172b;--muted:#5d5d80;--acc:#4a3bd8;--acc-fg:#fff;--img:#ecebf7}}
:root[data-theme="light"]{--bg:#f4f3fb;--card:#fff;--line:#d9d8ea;--fg:#17172b;--muted:#5d5d80;--acc:#4a3bd8;--acc-fg:#fff;--img:#ecebf7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.wrap{max-width:960px;margin:0 auto}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:4px 0 14px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px}
#q{width:100%;padding:14px 16px;font-size:16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin-bottom:12px}
.note{font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column}
.card h2{font-size:17px;text-align:center;margin:0 0 10px}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:var(--img)}
.ph{aspect-ratio:1;border-radius:14px;background:var(--img);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.row span:first-child{color:var(--muted)}
.row b{font-weight:600;text-align:right}
.tag{text-align:center;margin:10px 0 2px;font-weight:600;color:var(--acc)}
.btn{margin-top:12px;border:0;border-radius:99px;padding:12px;font-size:15px;font-weight:600;background:var(--acc);color:var(--acc-fg);cursor:pointer}
.form{margin-top:10px;display:none;flex-direction:column;gap:8px}
.card.open .form{display:flex}
.form label{font-size:13px;color:var(--muted)}
.form input[type=number]{padding:10px 12px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.form input[type=range]{width:100%;accent-color:var(--acc)}
.msg{font-size:13px;color:var(--muted);min-height:16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>speakerstd</h1><span class="sub">ценность юнитов</span></header>
<input id="q" type="search" placeholder="Поиск юнита" aria-label="Поиск юнита">
<div class="note" id="note">Юниты пока не оценены. Предложи цену и напиши, насколько юнит нужен игрокам: показываем среднее по всем предложениям.</div>

try{mine=JSON.parse(localStorage.getItem("ssd_mine")||"{}")}catch(e){mine={}}
function stats(id){var ps=[],ds=[];
  Object.keys(offers).forEach(function(u){var o=offers[u]&&offers[u][id];if(o){ps.push(o.p);ds.push(o.d)}});
  if(!ps.length)return null;
  ps.sort(function(a,b){return a-b});var m=ps.length>>1;
  var med=ps.length%2?ps[m]:(ps[m-1]+ps[m])/2;
  return{p:med,d:ds.reduce(function(a,b){return a+b},0)/ds.length,n:ps.length};
}
function fmt(n){return Math.round(n).toLocaleString("ru-RU")}
function render(){
  var f=qEl.value.trim().toLowerCase();
  grid.innerHTML="";
  U.forEach(function(u){
    if(f&&u[1].toLowerCase().indexOf(f)<0)return;
    var s=stats(u[0]),my=mine[u[0]],c=document.createElement("div");
    c.className="card"+(open===u[0]?" open":"");
    c.innerHTML='<h2></h2><img alt=""><div class="tag">'+(s?"По мнению игроков":"Не оценён")+'</div>'+
      '<div class="row"><span>Цена</span><b>'+(s?fmt(s.p):"?")+'</b></div>'+
      '<div class="row"><span>Нужность</span><b>'+(s?s.d.toFixed(1)+"/10":"?")+'</b></div>'+
      '<div class="row"><span>Предложений</span><b>'+(s?s.n:0)+'</b></div>'+
      '<button class="btn">'+(my?"Изменить моё":"Предложить цену")+'</button>'+
      '<div class="form"><label>Цена</label><input type="number" min="0" inputmode="numeric" placeholder="например 5000">'+
      '<label>Нужность: <span class="dv">5</span>/10</label><input type="range" min="1" max="10" step="0.5" value="5">'+
      '<button class="btn sv">Отправить</button><div class="msg"></div></div>';
    c.querySelector("h2").textContent=u[1];
    var im=c.querySelector("img");if(IMG[u[0]]){im.src=IMG[u[0]];im.alt=u[1]}else{var ph=document.createElement("div");ph.className="ph";ph.textContent="Нет фото";im.replaceWith(ph)}
    var pr=c.querySelector("input[type=number]"),rg=c.querySelector("input[type=range]"),dv=c.querySelector(".dv"),msg=c.querySelector(".msg");
    if(my){pr.value=my.p;rg.value=my.d;dv.textContent=my.d}
    rg.oninput=function(){dv.textContent=rg.value};
    c.querySelector(".btn").onclick=function(){open=open===u[0]?null:u[0];render()};
    c.querySelector(".sv").onclick=function(){
      var p=parseFloat(pr.value);
      if(!(p>=0)){msg.textContent="Введи цену числом";return}
      save(u[0],{p:p,d:parseFloat(rg.value)},msg);
    };
    grid.appendChild(c);
  });
}
function save(id,o,msg){
  mine[id]=o;offers[uid]=mine;
  try{localStorage.setItem("ssd_mine",JSON.stringify(mine))}catch(e){}
  if(mode==="db"){
    db.doc("offers/"+uid).set(mine).then(function(){open=null;render()},function(){
      mode="local";setNote();msg.textContent="Не удалось отправить, сохранено только у тебя";});
  }else{open=null;render()}
}
function setNote(){
  if(mode!=="db")note.textContent="Сейчас предложения видны только тебе на этом устройстве. Общий счётчик работает у тех, кто открывает страницу из своего аккаунта Claude.";
}
qEl.oninput=render;
render();
(async function(){
  try{
    var user=await claude.use("user"),d=await claude.use("db");
    if(!d||!user)return setNote();
    uid=await user.id();db=d;mode="db";
    var t=setTimeout(function(){note.textContent="Данные пока недоступны, показаны сохранённые ранее."},10000);
    d.collection("offers").onSnapshot(function(s){
      clearTimeout(t);offers={};
      s.docs.forEach(function(x){offers[x.id]=x.data()});
      if(offers[uid])mine=offers[uid];
      render();
    },function(){clearTimeout(t);mode="local";setNote()});
  }catch(e){setNote()}
})();
</script>
</body>
</html>
